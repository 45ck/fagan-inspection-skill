<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Magnifying glass icon -->
  <g transform="translate(220, 90)" filter="url(#glow-soft)">
    <!-- Glass circle -->
    <circle cx="52" cy="52" r="46" stroke="url(#glow)" stroke-width="5" fill="none"/>
    <!-- Handle -->
    <line x1="86" y1="86" x2="115" y2="115" stroke="url(#glow)" stroke-width="5" stroke-linecap="round"/>

    <!-- Checklist inside glass -->
    <!-- Checkbox 1 - checked -->
    <rect x="26" y="28" width="14" height="14" rx="2" stroke="#00e5ff" stroke-width="2" fill="none"/>
    <polyline points="29,35 33,39 39,30" stroke="#00e5ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="48" y1="35" x2="72" y2="35" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Checkbox 2 - checked -->
    <rect x="26" y="50" width="14" height="14" rx="2" stroke="#00e5ff" stroke-width="2" fill="none"/>
    <polyline points="29,57 33,61 39,52" stroke="#00e5ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="48" y1="57" x2="68" y2="57" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Checkbox 3 - empty -->
    <rect x="26" y="72" width="14" height="14" rx="2" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.5"/>
    <line x1="48" y1="79" x2="64" y2="79" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Title text -->
  <text x="380" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="72" fill="white" letter-spacing="-1">
    Fagan Inspection
  </text>

  <!-- Subtitle -->
  <text x="383" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="30" fill="#00e5ff" letter-spacing="3" opacity="0.9">
    Coding Agent Skill
  </text>

  <!-- Subtle decorative dots -->
  <circle cx="870" cy="108" r="3" fill="#00e5ff" opacity="0.15"/>
  <circle cx="890" cy="128" r="2" fill="#2979ff" opacity="0.12"/>
  <circle cx="920" cy="98" r="2.5" fill="#00e5ff" opacity="0.1"/>

  <!-- Subtle line accent under subtitle -->
  <line x1="383" y1="205" x2="580" y2="205" stroke="url(#glow)" stroke-width="1.5" opacity="0.3"/>
</svg>
