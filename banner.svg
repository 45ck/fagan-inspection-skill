<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Decorative: code brackets on left -->
  <g opacity="0.06">
    <text x="60" y="150" font-family="monospace" font-size="120" fill="#0d9488">{</text>
    <text x="60" y="330" font-family="monospace" font-size="120" fill="#0d9488">}</text>
  </g>

  <!-- Decorative: checklist items on right -->
  <g opacity="0.08" transform="translate(1020, 100)">
    <!-- Check 1 -->
    <rect x="0" y="0" width="16" height="16" rx="3" stroke="#10b981" stroke-width="2"/>
    <polyline points="3,8 7,12 13,3" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="8" x2="100" y2="8" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

    <!-- Check 2 -->
    <rect x="0" y="35" width="16" height="16" rx="3" stroke="#10b981" stroke-width="2"/>
    <polyline points="3,43 7,47 13,38" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="43" x2="85" y2="43" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

    <!-- Check 3 -->
    <rect x="0" y="70" width="16" height="16" rx="3" stroke="#10b981" stroke-width="2"/>
    <polyline points="3,78 7,82 13,73" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="78" x2="92" y2="78" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

    <!-- Unchecked -->
    <rect x="0" y="105" width="16" height="16" rx="3" stroke="#10b981" stroke-width="2" opacity="0.5"/>
    <line x1="24" y1="113" x2="78" y2="113" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Unchecked -->
    <rect x="0" y="140" width="16" height="16" rx="3" stroke="#10b981" stroke-width="2" opacity="0.3"/>
    <line x1="24" y1="148" x2="70" y2="148" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- Magnifying glass icon -->
  <g transform="translate(280, 120)" filter="url(#glow-soft)" opacity="0.15">
    <circle cx="52" cy="52" r="46" stroke="#0d9488" stroke-width="4" fill="none"/>
    <line x1="86" y1="86" x2="115" y2="115" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
    <text x="30" y="60" font-family="monospace" font-size="28" fill="#0d9488">&lt;/&gt;</text>
  </g>

  <!-- Decorative: 5 Fagan phases flow -->
  <g opacity="0.07" transform="translate(300, 320)">
    <circle cx="0" cy="0" r="6" fill="#0d9488"/>
    <line x1="6" y1="0" x2="140" y2="0" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="150" cy="0" r="6" fill="#0d9488"/>
    <line x1="156" y1="0" x2="290" y2="0" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="300" cy="0" r="6" fill="#0d9488"/>
    <line x1="306" y1="0" x2="440" y2="0" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="450" cy="0" r="6" fill="#0d9488"/>
    <line x1="456" y1="0" x2="590" y2="0" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="600" cy="0" r="6" fill="#10b981"/>
  </g>

  <!-- Title -->
  <text x="600" y="170" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="bold" fill="#5eead4">
    Fagan Inspection Skill
  </text>

  <!-- Subtitle -->
  <text x="600" y="225" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8b949e">
    Formal Fagan Inspection skill for AI coding assistants
  </text>

  <!-- Accent line -->
  <rect x="400" y="250" width="400" height="2" rx="1" fill="url(#accent)" opacity="0.4"/>
</svg>
